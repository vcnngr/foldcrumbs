[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foldcrumbs"
version = "0.6.0"
description = "Persistent cross-session memory for coding agents — file-based, no vector DB, no external service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincenzo Ingrosso" }]
keywords = ["claude-code", "codex", "opencode", "agent-memory", "llm", "hooks", "mlx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies — pure stdlib, so hook scripts never fail to import.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
foldcrumbs = "foldcrumbs.cli:main"
foldcrumbs-mcp = "foldcrumbs.mcp_server:main"

[project.urls]
Repository = "https://github.com/vcnngr/foldcrumbs"

[tool.setuptools.packages.find]
include = ["foldcrumbs*"]

[tool.setuptools.package-data]
foldcrumbs = ["hooks/*.py"]

[tool.ruff.lint]
# Ruff's historical default set, declared explicitly rather than inherited.
# 0.16 widened the implicit default and turned CI red on code that had not
# changed — including v0.5.0, which had shipped green. The wider set flags the
# broad excepts in the hooks and the federation writers (BLE001, S110), but
# those are the design: a hook must never break a session, and a store that
# cannot publish must still work locally. Pinning the linter would freeze the
# tooling; naming the contract keeps it reproducible across versions.
select = ["E4", "E7", "E9", "F"]
