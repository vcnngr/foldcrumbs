name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check foldcrumbs tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          # The production target is Apple Silicon: the fcntl/APFS paths only
          # run there in the wild, so the platform gets its own lane. Full
          # Python coverage stays on Ubuntu to keep the minutes down.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (zero runtime deps)
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Evolving-state mini-bench
        run: python benchmarks/evolving_state/run.py

  # The OPTIONAL bundled-embedding channel with its extra installed, plus a
  # real (non-mocked) inference smoke test against the pinned model. Kept
  # non-blocking on purpose: it depends on a HuggingFace download and an
  # optional dependency — a flake there must not red the core suite, which
  # already proves the channel degrades to "absent" cleanly.
  semantic-extra:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the semantic extra
        run: python -m pip install -e ".[semantic]"
      - name: Download the pinned bundle
        run: foldcrumbs embeddings setup
        env:
          FOLDCRUMBS_STATE_DIR: ${{ runner.temp }}/fc-state
      - name: Bundled channel tests (with onnxruntime present)
        run: python -m unittest tests.test_embeddings_local tests.test_wordpiece -v
        env:
          FOLDCRUMBS_STATE_DIR: ${{ runner.temp }}/fc-state
      - name: Real inference smoke test
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from foldcrumbs import embeddings_local as el
          assert el.available(), el.status()
          v = el.embed(["deploy tuesday utc", "deployment happens tuesday",
                        "the coffee machine is broken"])
          assert v and len(v) == 3 and len(v[0]) == 384
          from foldcrumbs.embeddings import cosine
          assert cosine(v[0], v[1]) > 0.5, "paraphrase pair too low"
          assert cosine(v[0], v[2]) < 0.3, "unrelated pair too high"
          print("bundled inference smoke: OK")
          PY
        env:
          FOLDCRUMBS_STATE_DIR: ${{ runner.temp }}/fc-state
